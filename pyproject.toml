[tool.poetry]
name = "django-visitor-pass"
version = "0.3.1"
description = "Django app for managing temporary session-based users."
license = "MIT"
authors = ["YunoJuno <code@yunojuno.com>"]
maintainers = ["YunoJuno <code@yunojuno.com>"]
readme = "README.md"
homepage = "https://github.com/yunojuno/django-visitor-pass"
repository = "https://github.com/yunojuno/django-visitor-pass"
documentation = "https://github.com/yunojuno/django-visitor-pass"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{ include = "visitors" }]

[project] # modern equivalent of `[tool.poetry]` - see https://peps.python.org/pep-0621/
name = "django-visitor-pass"
version = "0.3.1"
requires-python = ">=3.10"

[tool.poetry.dependencies]
python = "^3.10"
django = "^5.2"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-django = "*"
coverage = "*"
pylint = "*"
flake8 = "*"
flake8-bandit = "*"
flake8-docstrings = "*"
isort = "*"
mypy = "*"
pre-commit = "*"
black = {version = "*", allow-prereleases = true}
freezegun = "*"
tox = "*"
setuptools = "*"

[build-system]
requires = ["poetry>=1.7"]
build-backend = "poetry.masonry.api"
